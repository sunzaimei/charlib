[project]
name = "charlib"
version = "0.1.0"
description = "Rigged character GLB -> character library (expressions, talking, actions, Blender panel)"
readme = "README.md"
# bpy (Blender as a Python module) ships wheels only for CPython 3.11
requires-python = "==3.11.*"
dependencies = [
    "bpy==5.0.*",            # Blender as a Python module (needs Python 3.11)
    "numpy<2",
    "pillow>=10",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
charlib = "charlib.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["charlib"]

[tool.uv]
# Keep uv's resolver pinned to the same 3.11 bpy constraint.
package = true
